name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the declared environment
        run: python -m pip install -r requirements.lock
      - name: Check documentation, source bytes and saved paper
        run: python scripts/check_repository.py
      - name: Verify score algebra and inverse-set domains
        run: PYTHONPATH=scripts python -m pytest -q tests
      - name: Reproduce the declared purchase study
        run: |
          python scripts/build_us_purchase_panel.py
          python scripts/us_purchases.py --check
          python scripts/us_purchase_diagnostics.py --check

  independent-r-check:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.6.1'
          use-public-rspm: false
      - name: Install the declared environment
        run: python -m pip install -r requirements.lock
      - name: Independently reconstruct every retained calculation
        run: |
          python scripts/build_us_purchase_panel.py
          Rscript scripts/verify_us_purchases.R . reports/replay/r_us_purchases.csv
          python scripts/compare_us_purchases_r.py results/us_purchase_results.json reports/replay/r_us_purchases.csv --report reports/replay/us_purchase_verification.json
      - name: Retain numerical verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: purchase-verification
          path: reports/replay/
          retention-days: 30
