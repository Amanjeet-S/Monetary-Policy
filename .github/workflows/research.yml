name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-notebooks.lock
      - name: Install the declared environment
        run: python -m pip install -r requirements.lock -r requirements-notebooks.lock
      - name: Check documentation and saved sources
        run: python scripts/check_repository.py
      - name: Audit German data coverage
        run: python scripts/audit_germany_data.py
      - name: Construct the untransformed monthly panel
        run: python scripts/build_monthly_panel.py
      - name: Execute the coverage notebook
        run: python scripts/execute_notebooks.py
